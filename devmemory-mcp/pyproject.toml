readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
devmemory-mcp = "server:main"

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
